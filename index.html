<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📍 Geo-Tag Camera</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  
  #app-container {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Header */
  header {
    height: 50px; width: 100%; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  header h1 { color: #fff; font-size: 1.1rem; margin: 0; font-weight: 500; display: flex; align-items: center; gap: 5px; }

  /* Camera Window */
  #view-wrapper {
    position: relative; flex: 1; width: 100%; background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  video {
    width: 100%; height: 100%; object-fit: cover; transform: scale(1);
    transition: transform 0.1s ease-out;
  }

  /* Overlay UI */
  #overlay-box {
    position: absolute; bottom: 15px; left: 15px; right: 15px;
    background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    border-radius: 12px; padding: 12px 16px; color: #fff;
    display: flex; flex-direction: column; gap: 4px; pointer-events: none; z-index: 5;
  }
  .loc-title { color: #ffb300; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; }
  .loc-details { color: #e0e0e0; font-size: 0.8rem; margin: 0; font-family: monospace; line-height: 1.4; }

  /* Zoom Slider */
  #zoom-widget {
    position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 6;
    background: rgba(0,0,0,0.5); padding: 12px 6px; border-radius: 20px;
  }
  #zoom-slider {
    -webkit-appearance: slider-vertical; width: 8px; height: 120px; background: #555; outline: none; border-radius: 4px;
  }
  .zoom-label { color: #fff; font-size: 11px; font-weight: bold; font-family: monospace; }

  /* Controls Panel */
  #controls {
    height: 100px; width: 100%; background: #000;
    display: flex; align-items: center; justify-content: space-around; padding: 0 20px; z-index: 10;
  }
  .ctrl-btn {
    background: none; border: none; color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 12px; min-width: 70px;
  }
  .ctrl-btn svg { width: 26px; height: 26px; fill: currentColor; transition: transform 0.2s; }
  .ctrl-btn:active svg { transform: scale(0.9); }
  
  /* Shutter Ring & Circle */
  #shutter-btn {
    width: 68px; height: 68px; border-radius: 50%; border: 4px solid #fff;
    background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
  }
  #shutter-btn div { width: 52px; height: 52px; background: #fff; border-radius: 50%; transition: background 0.1s, transform 0.1s; }
  #shutter-btn:active div { background: #ccc; transform: scale(0.92); }
  #shutter-btn.disabled { opacity: 0.5; pointer-events: none; }

  /* Status and Toast Message */
  #toast {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(229, 57, 53, 0.9); color: white; padding: 10px 20px;
    border-radius: 20px; font-size: 13px; z-index: 20; display: none; text-align: center; max-width: 85%;
  }

  /* Hidden Canvas for capture rendering */
  canvas { display: none; }

  /* Landscape Responsive Optimization */
  @media (orientation: landscape) {
    #app-container { flex-direction: row; }
    header { position: absolute; top: 0; left: 0; width: calc(100% - 100px); background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
    #controls { width: 100px; height: 100%; flex-direction: column; padding: 20px 0; justify-content: space-around; }
    #zoom-widget { right: 115px; }
    #overlay-box { bottom: 15px; left: 15px; right: 115px; max-width: 450px; }
    #toast { top: 20px; left: calc(50% - 50px); }
  }
</style>
</head>
<body>

<div id="app-container">
  <header>
    <h1>📍 Geo-Tag Camera</h1>
  </header>

  <div id="view-wrapper" id="view-wrapper">
    <video autoplay playsinline id="video"></video>
    
    <div id="overlay-box">
      <div class="loc-title"><span style="color:#ff3d00">📍</span> <span id="lbl-address">Locating...</span></div>
      <div class="loc-details">Lat: <span id="lbl-lat">--</span>&deg;&nbsp;&nbsp;Long: <span id="lbl-lon">--</span>&deg;</div>
      <div class="loc-details">Time: <span id="lbl-time">--</span></div>
    </div>

    <div id="zoom-widget">
      <span class="zoom-label" id="zoom-value">1.0x</span>
      <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1">
    </div>
  </div>

  <div id="controls">
    <!-- Switch Camera Button -->
    <button class="ctrl-btn" onclick="toggleCamera()">
      <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
      <span>Switch</span>
    </button>

    <!-- Main Shutter Button -->
    <button id="shutter-btn" onclick="performCapture()"><div></div></button>

    <!-- Direct Gallery Download Button -->
    <button class="ctrl-btn" id="dl-btn" onclick="saveToGallery()" style="opacity: 0.5; pointer-events: none;">
      <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
      <span>Download</span>
    </button>
  </div>
</div>

<div id="toast"></div>
<canvas id="canvas"></canvas>

<script>
let videoStream = null;
let useFrontCamera = false;
let geoPosition = null;
let readableAddress = "Fetching area data...";
let activeZoom = 1.0;
let maxZoomSupported = 1.0;
let baseImageBlob = null;

// Pinch zoom tracking
let initialTouchDist = 0;

const videoEl = document.getElementById("video");
const canvasEl = document.getElementById("canvas");
const zoomSlider = document.getElementById("zoom-slider");
const zoomValueDisplay = document.getElementById("zoom-value");
const toastEl = document.getElementById("toast");
const dlBtn = document.getElementById("dl-btn");
const shutterBtn = document.getElementById("shutter-btn");

function showToast(message, isPersistent = false) {
  toastEl.textContent = message;
  toastEl.style.display = "block";
  if (!isPersistent) {
    setTimeout(() => { toastEl.style.display = "none"; }, 3500);
  }
}

function clearToast() {
  toastEl.style.display = "none";
}

// Complete resource deallocation to address standalone PWA lockups
async function killCameraTracks() {
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
    videoEl.srcObject = null;
    await new Promise(resolve => setTimeout(resolve, 200)); // Stability padding
  }
}

async function startCameraSystem() {
  await killCameraTracks();
  clearToast();
  
  const constraints = {
    video: {
      facingMode: useFrontCamera ? "user" : "environment",
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    }
  };

  try {
    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
    videoEl.srcObject = videoStream;
    
    // Evaluate hardware Zoom architecture
    const videoTrack = videoStream.getVideoTracks()[0];
    const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    
    if (capabilities.zoom) {
      zoomSlider.min = capabilities.zoom.min || 1;
      zoomSlider.max = capabilities.zoom.max || 5;
      zoomSlider.step = capabilities.zoom.step || 0.1;
      zoomSlider.value = activeZoom > capabilities.zoom.max ? capabilities.zoom.max : activeZoom;
      maxZoomSupported = capabilities.zoom.max;
    } else {
      // Fallback architecture for simulated viewport zoom scaling
      zoomSlider.min = 1;
      zoomSlider.max = 5;
      zoomSlider.step = 0.1;
      maxZoomSupported = 5;
    }
    
    triggerLocationPoll();
  } catch (err) {
    showToast("Camera Access Error: Hardware source could not be initialized.", true);
    console.error(err);
  }
}

function toggleCamera() {
  useFrontCamera = !useFrontCamera;
  activeZoom = 1.0;
  applyZoomSetting(1.0);
  startCameraSystem();
}

// Zoom Management (Supports native hardware manipulation & dynamic CSS pipeline fallback)
function applyZoomSetting(val) {
  activeZoom = parseFloat(val);
  zoomSlider.value = activeZoom;
  zoomValueDisplay.textContent = activeZoom.toFixed(1) + "x";

  if (videoStream) {
    const track = videoStream.getVideoTracks()[0];
    if (track.getCapabilities?.().zoom) {
      track.applyConstraints({ advanced: [{ zoom: activeZoom }] }).catch(() => {});
      videoEl.style.transform = `scale(1)`; // Reset CSS context if hardware absorbs change
      return;
    }
  }
  // Viewport emulation pipeline
  videoEl.style.transform = `scale(${activeZoom})`;
}

zoomSlider.addEventListener("input", (e) => {
  applyZoomSetting(e.target.value);
});

// Touch event registration for seamless multi-touch pinch configuration
const viewWrapper = document.getElementById("view-wrapper");
viewWrapper.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    initialTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });
