<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📍 Geo-Tag Camera</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 15px;
      text-align: center;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #camera-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* GPS Map Stamper style overlay */
    #overlay-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      max-width: 360px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #overlay-info strong {
      color: #ffca28;
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
    #errMsg {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      background: rgba(244, 67, 54, 0.9);
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      z-index: 10;
      display: none;
    }
    /* Bottom Controls mimicking camera UI */
    .controls-panel {
      background: #1e1e1e;
      padding: 20px 10px 30px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      border-top: 1px solid #333;
    }
    .mode-selector {
      display: flex;
      gap: 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
    }
    .mode-selector .active {
      color: #ffca28;
      font-weight: bold;
    }
    .buttons-row {
      display: flex;
      width: 100%;
      max-width: 400px;
      justify-content: space-around;
      align-items: center;
    }
    .cam-btn {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #ccc;
    }
    .cam-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    .capture-outer {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
    }
    .capture-inner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.1s;
    }
    .capture-outer:active .capture-inner {
      transform: scale(0.9);
    }
    canvas {
      display: none;
    }
    /* Modal / Result View */
    #result-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }
    #capturedImage {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 8px;
      background: #222;
    }
    .download-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .dl-btn {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      color: white;
      font-size: 14px;
    }
    .dl-png { background: #4CAF50; }
    .dl-jpg { background: #ff9800; }
  </style>
</head>
<body>

  <header>
    <h2>📍 Geo-Tag Camera</h2>
  </header>

  <div id="camera-container">
    <div id="errMsg"></div>
    <video autoplay id="video" playsinline></video>
    <div id="overlay-info">
      <strong>Locating...</strong>
      Fetching accurate GPS coordination data.
    </div>
  </div>

  <div class="controls-panel">
    <div class="mode-selector">
      <span>Share Photo</span>
      <span class="active">Photo</span>
      <span>Video</span>
      <span>Reports</span>
    </div>
    
    <div class="buttons-row">
      <button class="cam-btn" onclick="switchCamera()">
        <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
        Switch
      </button>
      
      <div class="capture-outer" onclick="captureImage()">
        <div class="capture-inner"></div>
      </div>
      
      <button class="cam-btn" onclick="stopCamera()">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        Stop
      </button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Gallery / Preview Modal -->
  <div id="result-modal">
    <div class="modal-header">
      <h3>📷 Captured Stamp</h3>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <img id="capturedImage" alt="Stamped Capture">
    <div class="download-actions">
      <a class="dl-btn dl-png" download="geotag_capture.png" id="downloadPngBtn">Download PNG</a>
      <a class="dl-btn dl-jpg" download="geotag_capture.jpg" id="downloadJpgBtn">Download JPG</a>
    </div>
  </div>

  <script>
    let video, canvas, stream, useFront = false;
    let currentPosition = null;
    let currentAddress = "Locating...";

    function showError(msg) {
      const errDiv = document.getElementById("errMsg");
      errDiv.textContent = msg;
      errDiv.style.display = msg ? "block" : "none";
    }

    async function initCamera() {
      stopCamera();
      video = document.getElementById("video");
      canvas = document.getElementById("canvas");
      if (!navigator.mediaDevices?.getUserMedia) {
        showError("Camera functionality is not supported by your browser/device.");
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFront ? "user" : "environment" }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => getLocation();
      } catch (e) {
        showError("Camera Access Error: " + e.message);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    function switchCamera() {
      useFront = !useFront;
      initCamera();
    }

    function getLocation() {
      if (!navigator.geolocation) {
        showError("GPS Location tracing is not supported.");
        return;
      }
      navigator.geolocation.getCurrentPosition(async pos => {
        currentPosition = pos.coords;
        currentAddress = await getAddress(pos.coords.latitude, pos.coords.longitude);
        updateOverlay();
      }, err => {
        showError("Location Access Denied/Error: " + err.message);
      });
    }

    async function getAddress(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
        const data = await res.json();
        const a = data.address || {};
        const place = a.village || a.hamlet || a.suburb || a.locality || a.town || a.city || "Vasad";
        const state = a.state || "Gujarat";
        const country = a.country || "India";
        return `${place}, ${state}, ${country}`;
      } catch {
        return "Vasad, Gujarat, India";
      }
    }

    function updateOverlay() {
      if (!currentPosition) return;
      const lat = currentPosition.latitude.toFixed(6);
      const lon = currentPosition.longitude.toFixed(6);
      const now = new Date();
      
      document.getElementById("overlay-info").innerHTML = `
        <strong>📍 ${currentAddress}</strong>
        Lat: ${lat}° &nbsp; Long: ${lon}°<br>
        Time: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}
      `;
    }

    async function captureImage() {
      if (!stream) { alert("Camera context is not active."); return; }
      if (!currentPosition) { alert("Awaiting verified GPS precision coordinates..."); return; }

      const lat = currentPosition.latitude.toFixed(6);
      const lon = currentPosition.longitude.toFixed(6);
      const now = new Date();

      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings();
      const w = settings.width || video.videoWidth;
      const h = settings.height || video.videoHeight;

      canvas.width = w; 
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      
      // Mirror flip preview if utilizing front camera
      if (useFront) {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, w, h);
      if (useFront) {
        ctx.setTransform(1, 0, 0, 1, 0, 0); // reset matrix
      }

      // Draw GPS Box Stamp (Bottom-Left custom layout mimicking screenshot reference)
      const lines = [
        `${currentAddress}`,
        `Lat ${lat}° Long ${lon}°`,
        `${now.toLocaleDateString()} ${now.toLocaleTimeString()} GMT+05:30`
      ];

      ctx.font = "bold 16px sans-serif";
      const padding = 12;
      const lineH = 22;
      const boxWidth = Math.max(...lines.map(l => ctx.measureText(l).width)) + (padding * 2);
      const boxHeight = (lines.length * lineH) + (padding * 2);
      
      const bx = 20;
      const by = h - boxHeight - 20;

      // Semi-transparent background panel
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(bx, by, boxWidth, boxHeight);
      
      // Left highlight border stripe
      ctx.fillStyle = "#ffca28";
      ctx.fillRect(bx, by, 4, boxHeight);

      // Render Typography Lines
      ctx.fillStyle = "white";
      lines.forEach((line, i) => {
        if(i === 0) ctx.fillStyle = "#ffca28"; // Highlight location name header
        else ctx.fillStyle = "white";
        ctx.fillText(line, bx + padding, by + padding + (i * lineH) + 14);
      });

      // Embed Top-Right Branding Watermark
      const wm = "Powered by TCM Guide";
      ctx.font = "bold 14px sans-serif";
      const tw = ctx.measureText(wm).width;
      const wx = w - tw - 30;
      const wy = 30;
      
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(wx - 10, wy - 18, tw + 20, 26);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(wm, wx, wy);

      // Export file objects
      const png = canvas.toDataURL("image/png");
      const jpg = canvas.toDataURL("image/jpeg", 0.92);
      
      document.getElementById("capturedImage").src = png;
      document.getElementById("downloadPngBtn").href = png;
      document.getElementById("downloadJpgBtn").href = jpg;
      document.getElementById("result-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("result-modal").style.display = "none";
    }

    window.addEventListener("load", () => initCamera());
  </script>
</body>
</html>
