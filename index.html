<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geo-Tag Camera</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      height: 50px;
      width: 100%;
      background: rgba(0, 0, 0, .8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    header h1 {
      color: #fff;
      font-size: 1.1rem;
      margin: 0;
      font-weight: 500;
    }
    #view-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .1s ease-out;
    }
    #overlay-box {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background: rgba(0, 0, 0, .65);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      pointer-events: none;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .loc-title {
      color: #ffb300;
      font-weight: 700;
      font-size: .95rem;
    }
    .loc-details {
      color: #e0e0e0;
      font-size: .8rem;
      font-family: monospace;
    }
    #zoom-widget {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 6;
      background: rgba(0, 0, 0, .5);
      padding: 12px 6px;
      border-radius: 20px;
    }
    #zoom-slider {
      -webkit-appearance: slider-vertical;
      width: 8px;
      height: 120px;
      background: #555;
      outline: 0;
      border-radius: 4px;
    }
    .zoom-label {
      color: #fff;
      font-size: 11px;
      font-family: monospace;
    }
    #controls {
      height: 100px;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 20px;
      z-index: 10;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      min-width: 70px;
    }
    .ctrl-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }
    #shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #shutter-btn div {
      width: 52px;
      height: 52px;
      background: #fff;
      border-radius: 50%;
    }
    #shutter-btn.disabled {
      opacity: .5;
      pointer-events: none;
    }
    #toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(229, 57, 53, .9);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 20;
      display: none;
    }
    canvas {
      display: none;
    }
    @media (orientation: landscape) {
      #app {
        flex-direction: row;
      }
      header {
        position: absolute;
        top: 0;
        left: 0;
        width: calc(100% - 100px);
        background: linear-gradient(to bottom, rgba(0, 0, 0, .7), transparent);
      }
      #controls {
        width: 100px;
        height: 100%;
        flex-direction: column;
        padding: 20px 0;
      }
      #zoom-widget {
        right: 115px;
      }
      #overlay-box {
        bottom: 15px;
        left: 15px;
        right: 115px;
        max-width: 450px;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <h1>📍 Geo-Tag Camera</h1>
    </header>

    <div id="view-wrapper">
      <video id="video" autoplay playsinline></video>

      <div id="overlay-box">
        <div class="loc-title" id="lbl-address">📍 Locating...</div>
        <div class="loc-details">
          Lat: <span id="lbl-lat">--</span>° &nbsp;&nbsp;
          Long: <span id="lbl-lon">--</span>°
        </div>
        <div class="loc-details">
          Time: <span id="lbl-time">--</span>
        </div>
      </div>

      <div id="zoom-widget">
        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1">
        <span class="zoom-label" id="zoom-value">1.0x</span>
      </div>

      <div id="toast"></div>
    </div>

    <div id="controls">
      <button class="ctrl-btn" onclick="toggleCamera()">
        <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8C6.25 13.95 6 13 6 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.45.85.7 1.8.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
        Switch
      </button>
      
      <div id="shutter-btn" onclick="performCapture()">
        <div></div>
      </div>

      <button class="ctrl-btn" id="dl-btn" onclick="saveToGallery()" style="opacity: 0.5; pointer-events: none;">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download
      </button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
